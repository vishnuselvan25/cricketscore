
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cricket Live Score</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="#">
                🏏 CricketZone
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#matches">Matches</a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    <!-- Hero Section -->
    <section class="hero text-center">

        <div class="container">

            <h1>Cricket Live Score</h1>

            <p>Stay updated with the latest cricket matches</p>

            <button class="btn btn-warning mt-3"
                onclick="loadMatches()">

                Refresh Scores

            </button>

        </div>

    </section>


    <!-- Match Section -->
    <section class="container py-5" id="matches">

        <h2 class="section-title text-center mb-4">
            Cricket Matches
        </h2>

        <!-- Search -->
        <div class="row mb-4">

            <div class="col-md-6 mx-auto">

                <input type="text"
                    id="searchInput"
                    class="form-control"
                    placeholder="Search team or match..."
                    oninput="searchMatches()">

            </div>

        </div>


        <!-- Filters -->
        <div class="text-center mb-4">

            <button class="btn btn-success filter-btn"
                onclick="filterMatches('all')">
                All
            </button>

            <button class="btn btn-danger filter-btn"
                onclick="filterMatches('live')">
                Live
            </button>

            <button class="btn btn-primary filter-btn"
                onclick="filterMatches('upcoming')">
                Upcoming
            </button>

            <button class="btn btn-secondary filter-btn"
                onclick="filterMatches('completed')">
                Completed
            </button>

        </div>


        <!-- Loading -->
        <div id="loading" class="text-center hidden">
            <div class="spinner-border text-success"></div>
            <p>Loading matches...</p>
        </div>


        <!-- Error -->
        <div id="errorMessage" class="alert alert-danger hidden">
        </div>


        <!-- Match Cards -->
        <div class="row g-4" id="matchContainer">

        </div>

    </section>


    <!-- Footer -->
    <footer class="text-center">

        <p>© 2026 CricketZone | Cricket Live Score App</p>

    </footer>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
